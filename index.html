here<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LIX - Trading & AI Intelligence Platform</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@100;400;700;900&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body, #root {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 200, 0.3);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 200, 0.6);
        }

        /* Global animations */
        @keyframes glow {
            0%, 100% {
                text-shadow: 0 0 10px rgba(0, 255, 200, 0.5), 0 0 20px rgba(147, 51, 234, 0.3);
            }
            50% {
                text-shadow: 0 0 20px rgba(0, 255, 200, 0.8), 0 0 40px rgba(147, 51, 234, 0.6);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes slide-in {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .animate-glow {
            animation: glow 2s ease-in-out infinite;
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        .animate-slide-in {
            animation: slide-in 0.5s ease-out;
        }

        /* Gradient background */
        .bg-circuit {
            background: linear-gradient(135deg, #0f172a 0%, #581c87 25%, #0f172a 50%, #1a1a2e 75%, #0f172a 100%);
            background-size: 400% 400%;
            animation: circuit 15s ease infinite;
        }

        @keyframes circuit {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* Neon text effect */
        .text-neon {
            color: #00ffc8;
            text-shadow: 0 0 10px rgba(0, 255, 200, 0.8), 0 0 20px rgba(147, 51, 234, 0.6);
        }

        /* Smooth transitions */
        * {
            transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 200ms;
        }

        /* Focus states */
        input:focus,
        button:focus,
        select:focus,
        textarea:focus {
            outline: none;
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.5);
        }

        /* Loading animation */
        .loader {
            border: 4px solid rgba(0, 255, 200, 0.1);
            border-top: 4px solid #00ffc8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Hover effects */
        button {
            transition: all 200ms ease;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Input field styling */
        input[type="text"],
        input[type="email"]
        input[type="password"],
        input[type="number"],
        textarea,
        select {
            transition: all 200ms ease;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #00ffc8;
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.3);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="/src/index.js"></script>
</body>
  </html>
